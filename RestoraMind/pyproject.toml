[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restoramind"
version = "1.0"
description = "RestoraMind 基于多模态推理与强化学习的图像复原智能体软件"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "opencv-python-headless", "pandas", "pyarrow", "flask", "requests"]

[project.scripts]
restoramind = "restoramind.cli:main"

[tool.setuptools.packages.find]
include = ["restoramind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
